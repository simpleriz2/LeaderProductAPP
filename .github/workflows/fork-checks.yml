name: Fork checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_PUBLIC_API_URL_DEV: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/checkForkIdentity.cjs
      - run: npx tsc --noEmit
      - run: npm run test:unit -- --runInBand __tests__/orderOutboxCore.unit.test.ts __tests__/serviceRoutes.unit.test.ts __tests__/forkUpdateIsolation.unit.test.ts
