name: Fork checks
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_PUBLIC_API_URL_DEV: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --test scripts/legacyPublicationDisabled.test.cjs
      - run: npm ci
      - run: node scripts/checkForkIdentity.cjs
      - run: npx tsc --noEmit
      - run: npm run test:unit -- --runInBand __tests__/orderOutboxCore.unit.test.ts __tests__/serviceRoutes.unit.test.ts __tests__/forkUpdateIsolation.unit.test.ts __tests__/qrService.transport.unit.test.ts __tests__/qrContact.unit.test.ts
  standalone-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-host
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-host/package-lock.json
      - run: npm ci
      - run: node scripts/hostRuntime.cjs --base-ref "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npm run test:runtime
      - run: npm run test:remote-packages
      - run: npm run test:qr-packages
      - uses: actions/checkout@v4
        with:
          repository: simpleriz2/LeaderProductAPI
          # Exact compatible fork protocol; never follow upstream/main or floating latest.
          ref: e9a0805aea602286d6e2cf47f0223fa33e51c3f4
          path: partner-api
          sparse-checkout: dev/platform-pilot
          persist-credentials: false
      - run: npm run test:pilot-session
        env:
          LP2_API_PILOT_ROOT: ${{ github.workspace }}/partner-api
      - run: npm run test:company-window
        env:
          LP2_API_PILOT_ROOT: ${{ github.workspace }}/partner-api
      - run: npm run test:platform-variants
        env:
          LP2_API_PILOT_ROOT: ${{ github.workspace }}/partner-api
      - run: npm run test:pilot-delivery
        env:
          LP2_API_PILOT_ROOT: ${{ github.workspace }}/partner-api
      - run: npm run test:crypto
      - run: npm run test:http
      - run: npm run test:recovery
      - run: npm run test:database
      - run: npm run test:qr-storage
      - run: npm run bundle:android:dev
      - run: npm run bundle:android
      - run: npm run bundle:android:loader
      - run: npm run build:web
  standalone-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform-host
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-host/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/hostRuntime.cjs --base-ref "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
      - run: node scripts/local-keystore.cjs
      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=1 -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" -Pkotlin.compiler.execution.strategy=in-process
        working-directory: platform-host/android
  standalone-web-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform-host
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform-host/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:web-storage
      - uses: actions/checkout@v4
        with:
          repository: simpleriz2/LeaderProductAPI
          ref: e9a0805aea602286d6e2cf47f0223fa33e51c3f4
          path: partner-api
          sparse-checkout: dev/platform-pilot
          persist-credentials: false
      - run: npm run test:web-host
        env:
          LP2_API_PILOT_ROOT: ${{ github.workspace }}/partner-api
  standalone-qr-business:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform-host
    services:
      postgres:
        image: postgres:15.19-alpine
        env:
          POSTGRES_USER: lp2_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: lp2_realtime_fixture
        ports: ['127.0.0.1:54329:5432']
        options: >-
          --health-cmd "pg_isready -U lp2_fixture -d lp2_realtime_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=3072
      RAYON_NUM_THREADS: '2'
      DATABASE_URL: postgresql://lp2_fixture:fixture-only@127.0.0.1:54329/lp2_realtime_fixture
      LP2_COMPANY_TEST_DATABASE_URL: postgresql://lp2_fixture:fixture-only@127.0.0.1:54329/lp2_realtime_fixture
      LP2_API_PILOT_ROOT: ${{ github.workspace }}/partner-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: simpleriz2/LeaderProductAPI
          ref: fdd826ed580e76991d134969727ceaf66f562366
          path: partner-api
          sparse-checkout: |
            dev/platform-pilot
            dev/realtime
            dev/testSafety
            src/modules/qr
            prisma
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform-host/package-lock.json
            partner-api/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: partner-api
      - run: npx prisma generate
        working-directory: partner-api
      - run: node dev/realtime/markFixture.cjs
        working-directory: partner-api
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:web-business
